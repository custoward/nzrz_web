# 누가 push 하든 Vercel 이 배포하게 한다.
#
# Vercel Hobby(무료) 플랜은 프로젝트에 연결된 계정이 author 인 커밋만
# 빌드한다. 팀원 초대는 Pro 부터라 형한테 «키를 주는» 방법이 없다.
# 그래서 접근 권한 대신 Deploy Hook 을 쓴다 — 훅 URL 은 저장소 시크릿에
# 숨겨두고, push 가 있을 때 GitHub 가 대신 눌러준다.
#
# ── 처음 한 번 설정 (민성) ─────────────────────────────────────
#  1. Vercel → 프로젝트 → Settings → Git → Deploy Hooks
#     이름 아무거나, 브랜치는 main → Create Hook → URL 복사
#  2. GitHub → 저장소 → Settings → Secrets and variables → Actions
#     → New repository secret
#     Name  : VERCEL_DEPLOY_HOOK
#     Secret: 위에서 복사한 URL
#
# 시크릿을 넣기 전까지 이 워크플로는 경고만 남기고 그냥 지나간다.

name: Vercel 배포

on:
  push:
    branches: [main]

# 연달아 push 되면 마지막 것만 배포한다
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 소유자가 push 한 건 Vercel 이 알아서 빌드한다. 훅까지 부르면
    # 같은 커밋을 두 번 배포하게 되므로 건너뛴다.
    if: github.actor != 'custoward'

    steps:
      - name: Deploy Hook 호출
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK 시크릿이 없어 배포를 건너뜁니다. 이 파일 맨 위의 설정 절차를 따르세요."
            exit 0
          fi
          echo "$GITHUB_ACTOR 의 push 로 배포를 겁니다."
          curl -fsS -X POST "$HOOK"
          echo
          echo "Vercel 에 배포 요청을 보냈습니다."
