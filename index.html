<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>느즈러짐</title>
<link rel="icon" href="logo.svg">

<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }

  img {
    width: 180px;
    max-width: 40vw;
    height: auto;
    transition: transform 900ms cubic-bezier(.16, 1, .3, 1);
  }

  /* 이름 그대로, 살짝 느슨해진다 */
  img:hover {
    transform: translateY(7px) rotate(2.5deg);
  }

  @media (prefers-reduced-motion: reduce) {
    img {
      transition: none;
    }
    img:hover {
      transform: none;
    }
  }
</style>
</head>
<body>

<img src="logo.svg" alt="느즈러짐">

</script>

</body>
</html>
